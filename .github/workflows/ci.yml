# ============================================================
#  Проверка и публикация образа.
#
#  Порядок принципиальный: сначала тесты и типы, потом сборка
#  образа и прогон смоука ПО СОБРАННОМУ образу, и только после
#  этого публикация. В Docker Hub не должно уезжать то, что
#  никто не запускал.
# ============================================================

name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/shff-planner
  NODE_VERSION: '22'

jobs:
  check:
    name: типы и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: типы
        run: npm run typecheck

      - name: тесты
        run: npm test

      - name: сборка
        run: npm run build

  image:
    name: образ и публикация
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # amd64-образ собираем локально и прогоняем по нему смоук
      - name: собрать образ для проверки
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shff-planner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: поднять контейнер
        run: |
          docker run -d --name shff-ci -p 8787:8787 shff-planner:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health

      - name: смоук по собранному образу
        run: |
          # первый запуск: выбираем свободный вход, иначе API не отдаёт данные
          curl -fsS -X POST http://127.0.0.1:8787/api/auth/setup \
            -H 'Content-Type: application/json' -d '{"mode":"open"}' > /dev/null
          node scripts/smoke.mjs http://127.0.0.1:8787

      - name: логи контейнера, если упало
        if: failure()
        run: docker logs shff-ci

      - name: убрать контейнер
        if: always()
        run: docker rm -f shff-ci

      # публикуем только с master и тегов, и только после зелёного смоука
      - name: вход в Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: версия из package.json
        if: github.event_name != 'pull_request'
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: метки образа
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.pkg.outputs.version }},enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=SHFF Planner
            org.opencontainers.image.description=Поминутный планировщик суток. Self-hosted, локальная база, без трекинга.

      # arm64 — ради одноплатников (Raspberry Pi и родня). Собирается через
      # эмуляцию и потому долго: у better-sqlite3 нет готовых бинарей, он
      # компилируется из исходников. JS-часть от архитектуры не зависит и
      # собирается нативно (см. --platform=$BUILDPLATFORM в Dockerfile),
      # под QEMU уходит только компиляция нативного модуля.
      - name: собрать и запушить
        if: github.event_name != 'pull_request'
        timeout-minutes: 90
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: что уехало
        if: github.event_name != 'pull_request'
        run: |
          echo "### Образ опубликован" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
